services:
  - type: web
    name: bustrack-api
    runtime: node
    plan: free
    rootDir: functions
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REVENUECAT_API_KEY
        sync: false
      - key: REVENUECAT_ALLOW_SANDBOX
        value: "true"
